name: Unpack site bundle

on:
  push:
    branches: ["build/kansai-late-summer-2026"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site bundle
        shell: bash
        run: |
          if [ ! -f site.tar.gz.b64 ]; then
            echo "No bundle to unpack."
            exit 0
          fi
          base64 --decode site.tar.gz.b64 > /tmp/site.tar.gz
          tar -xzf /tmp/site.tar.gz
          rm site.tar.gz.b64
      - name: Build and validate
        shell: bash
        run: |
          python3 scripts/build.py
          python3 scripts/validate_site.py
      - name: Commit generated site
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: publish Kansai late-summer travel site"
          git push
