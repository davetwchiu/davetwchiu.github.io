name: Unpack site bundle

on:
  push:
    branches: ["build/kansai-late-summer-2026"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Unpack site bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f site.tar.gz.b64 ]; then
            echo "No bundle to unpack; validating the current tree."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import base64

          source = Path("site.tar.gz.b64").read_text(encoding="utf-8")
          payload = "".join(source.split())
          payload += "=" * (-len(payload) % 4)
          Path("/tmp/site.tar.gz").write_bytes(base64.b64decode(payload, validate=True))
          PY

          tar -tzf /tmp/site.tar.gz >/tmp/site-files.txt
          echo "Bundle contains $(wc -l </tmp/site-files.txt) files."
          tar -xzf /tmp/site.tar.gz
          rm site.tar.gz.b64

      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          required = [
              "index.html",
              "daily.html",
              "culture.html",
              "museums.html",
              "food.html",
              "maps.html",
              "assets/style.css",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("Missing required site files: " + ", ".join(missing))

          for path in required[:6]:
              text = Path(path).read_text(encoding="utf-8")
              if "<html" not in text.lower() or "</html>" not in text.lower():
                  raise SystemExit(f"Invalid HTML document: {path}")

          print("Site validation passed.")
          PY

      - name: Commit generated site
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: publish Kansai late-summer travel site"
          git push
